<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="L1_S2_calc.css">
</head>
<body>
    <h1>Geophysical Engineering</h1>
    <!-- -------------------------- For GE students -------------------------------- -->
    <div id="myBox4">
        <h3>Mathematics2</h3>
        <hr>
        <h4>Mathematics2</h4>
        <div id="spacesForMath">
            <label for="" id="Notebook">Participation:</label>
            <input type="number" class="MathNotebook">
            <label for="" id="MMidterm">Midterm Exam:</label>
            <input type="number" class="MathMidterm">
            <label for="" id="MFinal">Final Exam:</label>
            <input type="number" class="MathFinal">
        </div>

        <br>

        <h3>French</h3>
        <hr>
        <h4>French</h4>
        <div id="spacesForLang">
            <label for="" id="Notebook">Midterm Exam:</label>
            <input type="number" class="LangMidterm">
            <label for="" id="MMidterm">Speaking Exam:</label>
            <input type="number" class="LangSpeaking">
            <label for="" id="MFinal">Final Exam:</label>
            <input type="number" class="LangFinal">
        </div>

        <br>

        <h3>Physics2</h3>
        <hr>
        <h4>Physics2</h4>
        <div id="spacesForPhysics">
            <label for="" id="Notebook">Oscillators:</label>
            <input type="number" class="PhysicsFinal1">
            <label for="" id="Notebook">Waves:</label>
            <input type="number" class="PhysicsFinal2">
            <label for="" id="Notebook">Optics:</label>
            <input type="number" class="PhysicsFinal3">
            <label for="" id="MMidterm">Report:</label>
            <input type="number" class="PhysicsFinal4">
            <label for="" id="MFinal">Practical Work:</label>
            <input type="number" class="PhysicsFinal5">
        </div>



        <h3>Chemistry2</h3>
        <hr>
        <h4>Chemistry2</h4>
        <div id="spacesForChemistry">
            <label for="" id="MMidterm">AOM2 (Midterm Exam):</label>
            <input type="number" class="ChemMidterm">
            <label for="" id="MFinal">AOM2 (Final Exam):</label>
            <input type="number" class="ChemFinal">
            <label for="" id="MMidterm">TOM2 (Midterm Exam):</label>
            <input type="number" class="ChemMidtermT">
            <label for="" id="MFinal">TOM2 (Final Exam):</label>
            <input type="number" class="ChemFinalT">
        </div>


        <h3>Geosciences2</h3>
        <hr>
        <h4>Geosciences2</h4>
        <div id="spacesForGeosciences">
            <label for="" id="MMidterm">Gravimetry and isostasy (Final Exam):</label>
            <input type="number" class="GiFinal">
            <label for="" id="MFinal">Plate tectonics (Final Exam):</label>
            <input type="number" class="PtFinal">
            <label for="" id="MMidterm">Recognizing minerals and rocks:</label>
            <input type="number" class="MR">
            <label for="" id="MFinal">Mineralogy & Petrology (Final Exam):</label>
            <input type="number" class="MPFinal"> 
        </div>
    </div>

    <br>
    <button onclick="Calculate()">Calculate GPA:</button>
    <p id="myResult"></p>
    <script src="script.js"></script>
</body>
</html>
